name: torchspin tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install torchspin
        run: pip install -e ".[dev]"

      - name: Verify wheel builds cleanly
        run: |
          pip install build twine
          python -m build --wheel --outdir dist/
          twine check dist/*.whl

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -c "import torchspin; print('version:', torchspin.__version__)"
          python -c "from torchspin.nucdata import nucdata; print('14N:', nucdata('14N'))"
          python -c "from torchspin import SpinSystem, Experiment, Options, pepper; \
                     sys = SpinSystem(S=[0.5], g=[[2.0, 2.1, 2.2]], lw=[1.0, 0.0]); \
                     exp = Experiment(mwFreq=9.5, Range=[300.0, 350.0], nPoints=256, Harmonic=1); \
                     B, spc = pepper(sys, exp, Options(GridSize=19, Verbosity=0)); \
                     print('pepper shape:', spc.shape)"

      - name: Run test suite (unit + non-MATLAB tests)
        run: pytest torchspin/tests -q --tb=line -m "not slow and not requires_matlab_data"
        env:
          TZ: UTC
