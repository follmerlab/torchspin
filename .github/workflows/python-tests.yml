name: torchspin tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install torchspin
        run: pip install -e ".[dev]"

      - name: Verify wheel builds cleanly
        run: |
          pip install build twine
          python -m build --wheel --outdir dist/
          twine check dist/*.whl

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -c "import torchspin; print('version:', torchspin.__version__)"
          python -c "from torchspin.nucdata import nucdata; print('14N:', nucdata('14N'))"
          python -c "from torchspin import SpinSystem, Experiment, Options, pepper; \
                     sys = SpinSystem(S=[0.5], g=[[2.0, 2.1, 2.2]], lw=[1.0, 0.0]); \
                     exp = Experiment(mwFreq=9.5, Range=[300.0, 350.0], nPoints=256, Harmonic=1); \
                     B, spc = pepper(sys, exp, Options(GridSize=19, Verbosity=0)); \
                     print('pepper shape:', spc.shape)"

      - name: Run fast test pass (cross-validation deselected)
        # The full cross-validation suite runs once in the full-suite job below;
        # this matrix exists to catch platform- and version-specific breakage fast.
        run: pytest -q --tb=line -m "not slow" -k "not matlab_validation"
        env:
          TZ: UTC

  full-suite:
    # One cell that runs everything, including the 673 MATLAB cross-validation
    # tests the matrix deselects. This is the job that would have caught the
    # NumPy 2.0 and case-sensitive-filesystem breakage fixed in v0.3.0, so it
    # must stay in the required set even though it is the slow one.
    name: Full suite (Linux, 3.12, incl. MATLAB cross-validation)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install torchspin
        run: pip install -e ".[test]"

      - name: Record the resolved environment
        run: |
          python - <<'EOF'
          import sys, numpy, scipy, torch, torchspin
          print('torchspin', torchspin.__version__)
          print('python   ', sys.version.split()[0])
          print('numpy    ', numpy.__version__, '| scipy', scipy.__version__, '| torch', torch.__version__)
          print('numpy.trapz present:', hasattr(numpy, 'trapz'),
                '| numpy.trapezoid present:', hasattr(numpy, 'trapezoid'))
          EOF

      - name: Run the full suite
        # TORCHSPIN_STRICT_REFS makes a missing tests/data/*.mat a hard failure
        # (see torchspin/tests/conftest.py) instead of a silent skip.
        run: pytest -q --tb=short -rsx
        env:
          TZ: UTC
          TORCHSPIN_STRICT_REFS: "1"
