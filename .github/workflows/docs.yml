name: docs

# Builds the Sphinx documentation site (docs/): the API reference generated
# from the docstrings, the Markdown pages, and the tutorial notebooks, which
# are rendered as committed and never executed.  Pushes to main deploy the
# site to GitHub Pages when Pages is enabled for the repository; pull requests
# only build it (the HTML is kept as a workflow artifact).

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'examples/notebooks/**'
      - 'torchspin/**'
      - 'README.md'
      - 'KNOWN_LIMITATIONS.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/notebooks/**'
      - 'torchspin/**'
      - 'README.md'
      - 'KNOWN_LIMITATIONS.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torchspin with the docs extra
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[docs]"
      - name: Build the site
        run: |
          sphinx-build -b html docs docs/_build/html -w docs-warnings.log
          n=$(grep -cE 'WARNING|ERROR' docs-warnings.log || true)
          echo "Sphinx warnings: $n" >> "$GITHUB_STEP_SUMMARY"
      - name: Check that every public name is in the API reference
        run: python docs/scripts/api_inventory.py --check --output "$RUNNER_TEMP/api_inventory.md"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true   # Pages may not be enabled on a private repository
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
