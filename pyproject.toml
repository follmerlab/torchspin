[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchspin"
version = "0.3.0"
description = "Differentiable PyTorch port of EasySpin - EPR/ESR spin Hamiltonian and spectrum simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    { name = "Alec Follmer", email = "ahfollmer@ucdavis.edu" },
]
maintainers = [
    { name = "Alec Follmer", email = "ahfollmer@ucdavis.edu" },
]
keywords = [
    "EPR", "ESR", "spectroscopy", "spin-Hamiltonian",
    "pytorch", "autograd", "magnetic-resonance", "quantum",
    "EasySpin", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0,<3",
    "numpy>=1.23,<3",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/follmerlab/torchspin"
Source = "https://github.com/follmerlab/torchspin"
Issues = "https://github.com/follmerlab/torchspin/issues"
"Upstream (EasySpin)" = "https://easyspin.org"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
fit = ["cloudpickle>=2.0"]          # process-pool esfit with notebook-defined models
gui = ["ipywidgets>=7.6", "matplotlib>=3.6", "ipympl>=0.9"]   # interactive fitting panel (torchspin.fitgui)
test = ["pytest>=7", "pytest-cov", "matplotlib>=3.6", "cloudpickle>=2.0"]
dev = ["pytest>=7", "pytest-cov", "build", "twine", "matplotlib>=3.6", "cloudpickle>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torchspin", "torchspin.*"]
exclude = ["torchspin.tests", "torchspin.tests.*"]

[tool.setuptools.package-data]
torchspin = ["data/*.txt", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["torchspin/tests"]
markers = [
    "slow: long-running stochastic tests; deselect with -m \"not slow\"",
    "requires_matlab_data: reserved; not currently applied to any test. The MATLAB\n    reference .mat files ship with the repository, so the cross-validation suite\n    runs by default -- select it by name with -k matlab_validation.",
]
